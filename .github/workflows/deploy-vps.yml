name: Deploy Swarm HQ to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          HQ_PASSWORD: ${{ secrets.HQ_PASSWORD }}
          HQ_AUTH_SECRET: ${{ secrets.HQ_AUTH_SECRET }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USERNAME" ] || [ -z "$VPS_PASSWORD" ] || [ -z "$HQ_PASSWORD" ] || [ -z "$HQ_AUTH_SECRET" ]; then
            echo "::error::Missing one or more required secrets (VPS_HOST, VPS_USERNAME, VPS_PASSWORD, HQ_PASSWORD, HQ_AUTH_SECRET). Set them in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 [CI/CD] Starting Deployment to /opt/agent-office-hq..."
            
            # Ensure target directory exists
            mkdir -p /opt/agent-office-hq
            cd /opt/agent-office-hq
            
            # If git repo already initialized, pull latest; otherwise clone/fetch
            if [ -d ".git" ]; then
              git fetch --all
              git reset --hard origin/main
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git /tmp/agent-hq-clone
              cp -rf /tmp/agent-hq-clone/* /opt/agent-office-hq/
              cp -rf /tmp/agent-hq-clone/.git /opt/agent-office-hq/
              rm -rf /tmp/agent-hq-clone
            fi

            # Recreate Docker container
            echo "🔄 [CI/CD] Preparing configuration and container..."
            docker stop agent-office-hq 2>/dev/null || true
            docker rm agent-office-hq 2>/dev/null || true

            # Write .env safely
            cat << 'ENVEOF' > /opt/agent-office-hq/.env
HQ_PASSWORD=${{ secrets.HQ_PASSWORD }}
HQ_AUTH_SECRET=${{ secrets.HQ_AUTH_SECRET }}
NODE_ENV=production
TRUST_PROXY=true
PORT=3333
ENVEOF

            # Write GSC service account credentials file
            mkdir -p /opt/agent-office-hq/data
            cat << 'JSONEOF' > /opt/agent-office-hq/data/gsc-credentials.json
${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
JSONEOF

            # Run Docker container safely using --env-file
            docker run -d --name agent-office-hq --restart always --network coolify \
              --env-file /opt/agent-office-hq/.env \
              -v /opt/agent-office-hq:/app -w /app \
              node:20-alpine node server.mjs

            echo "✅ [CI/CD] Deployment completed successfully! Live on https://seo.tepatlaser.com"
