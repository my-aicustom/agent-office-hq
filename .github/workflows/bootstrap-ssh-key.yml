name: One-time SSH key bootstrap

on:
  workflow_dispatch:

jobs:
  install-key:
    runs-on: ubuntu-latest
    steps:
      - name: Verify migration secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USERNAME" ] || [ -z "$VPS_PASSWORD" ] || [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "::error::Missing one or more SSH migration secrets."
            exit 1
          fi

      - name: Install dedicated deploy public key
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -eu
            umask 077
            mkdir -p "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            grep -qxF '${{ secrets.SSH_PUBLIC_KEY }}' "$HOME/.ssh/authorized_keys" || printf '%s\n' '${{ secrets.SSH_PUBLIC_KEY }}' >> "$HOME/.ssh/authorized_keys"
            chmod 700 "$HOME/.ssh"
            chmod 600 "$HOME/.ssh/authorized_keys"
            echo "Dedicated deploy public key installed."
